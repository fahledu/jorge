# CI do esqueleto: documentação, hooks e varredura de segredos, num job só (o GitHub
# cobra cada job arredondado para o minuto de cima). Roda em todo push, inclusive só de
# documentação: segredo também vaza em .md. Lint, typecheck, testes e build da stack
# ficam em outro workflow, que o agente devops cria conforme o ADR de CI. O gitleaks não
# sai: ajuste as regras em .gitleaks.toml (com o usuário), nunca removendo o passo.
name: CI

on:
  push:
    branches: [main, master] # o branch padrão, qualquer que seja o nome
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Ações fixadas por SHA de commit (a versão vai no comentário); o Dependabot atualiza.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo, para o gitleaks
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # mesma versão do ADR 0003
      - run: node scripts/check-docs.mjs
      - run: node --test .claude/hooks/hooks.test.mjs
      # Imagem oficial em versão e digest fixos (a ação oficial exige licença em
      # repositório de organização); a mesma de scripts/check-secrets.mjs.
      # safe.directory: o repositório pertence ao usuário do runner.
      # !cancelled(): varre mesmo se um passo anterior falhou.
      - name: gitleaks
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --verbose
